server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pos-backend

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_db?TimeZone=America/Costa_Rica}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false

  jackson:
  time-zone: America/Costa_Rica
  serialization:
    write-dates-as-timestamps: false

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:pos-backend}
    audience: ${JWT_AUDIENCE:pos-frontend}
    access-token-expiration-seconds: ${JWT_ACCESS_EXP_SECONDS:28800}
    refresh-token-expiration-seconds: ${JWT_REFRESH_EXP_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
    allow-credentials: false
